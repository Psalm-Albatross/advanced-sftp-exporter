name: Build & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'
      
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --config=.golangci.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'
      
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
          - os: linux
            arch: 386
          - os: linux
            arch: ppc64le
          - os: linux
            arch: s390x
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: freebsd
            arch: amd64
          - os: freebsd
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: windows
            arch: 386

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "BUILD_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_DATE: ${{ steps.version.outputs.BUILD_DATE }}
          BUILD_HASH: ${{ steps.version.outputs.BUILD_HASH }}
          GO_VERSION: go1.25.5
        run: |
          LDFLAGS="-X 'main.Version=${{ env.VERSION }}' \
                   -X 'main.BuildDate=${{ env.BUILD_DATE }}' \
                   -X 'main.BuildHash=${{ env.BUILD_HASH }}' \
                   -X 'main.GoVersion=${{ env.GO_VERSION }}'"
          
          OUTPUT_NAME="advanced-sftp-exporter-${{ env.VERSION }}.${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          
          go build -ldflags "$LDFLAGS" -o "bin/${OUTPUT_NAME}" *.go
          echo "BINARY_PATH=bin/${OUTPUT_NAME}" >> $GITHUB_ENV
          echo "BINARY_NAME=${OUTPUT_NAME}" >> $GITHUB_ENV
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: binaries
          path: ${{ env.BINARY_PATH }}
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/download-artifact@v3
        with:
          name: binaries
          path: bin/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*
          fail_on_unmatched_files: true
          generate_release_notes: true
