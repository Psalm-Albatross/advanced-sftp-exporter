apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "advanced-sftp-exporter.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "advanced-sftp-exporter.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Advanced SFTP Exporter Configuration
    # Generated by Helm Chart
    
    monitoring:
      enabled: {{ .Values.config.monitoring.enabled }}
      interval: {{ .Values.config.monitoring.interval }}
      timeout: {{ .Values.config.monitoring.timeout }}
      max_parallel: {{ .Values.config.monitoring.maxParallel }}
    
    security:
      enable_tls: {{ .Values.config.security.enableTLS }}
      cert_file: {{ .Values.config.security.certFile }}
      key_file: {{ .Values.config.security.keyFile }}
      client_auth: {{ .Values.config.security.clientAuth }}
    
    performance:
      max_connections: {{ .Values.config.performance.maxConnections }}
      buffer_size: {{ .Values.config.performance.bufferSize }}
      connection_timeout: {{ .Values.config.performance.connectionTimeout }}
      read_timeout: {{ .Values.config.performance.readTimeout }}
    
    web:
      listen_address: {{ .Values.config.web.listenAddress }}
      metrics_path: {{ .Values.config.web.metricsPath }}
      health_path: {{ .Values.config.web.healthPath }}
      readiness_path: {{ .Values.config.web.readinessPath }}
    
    logging:
      level: {{ .Values.logging.level }}
      format: {{ .Values.logging.format }}
      file: {{ .Values.config.logging.file }}
      max_size_mb: {{ .Values.config.logging.maxSizeMb }}
      max_age_days: {{ .Values.config.logging.maxAgeDays }}
    
    metrics:
      enabled: {{ .Values.config.metrics.enabled }}
      include_go_metrics: {{ .Values.config.metrics.includeGoMetrics }}
      include_process_metrics: {{ .Values.config.metrics.includeProcessMetrics }}
    
    alerts:
      sftp_up_threshold: {{ .Values.config.alerts.sftpUpThreshold }}
      open_files_threshold: {{ .Values.config.alerts.openFilesThreshold }}
      command_latency_threshold: {{ .Values.config.alerts.commandLatencyThreshold }}
