# Prometheus Configuration for SFTP Exporter
# Integration with Phase 4 deployment

# Add this to your Prometheus configuration file (usually /etc/prometheus/prometheus.yml)
# or create a new file and include it

global:
  scrape_interval: 30s          # Scrape every 30s (Phase 4 default)
  evaluation_interval: 15s
  external_labels:
    service: 'sftp-exporter'
    environment: 'production'   # Change to staging/test as needed

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # - 'alertmanager:9093'
            - 'localhost:9093'   # Uncomment if running Alertmanager

# Alert rules files (optional)
rule_files:
  # - '/etc/prometheus/sftp-exporter-alerts.yml'    # Uncomment to add alert rules
  # - '/etc/prometheus/sftp-exporter-recording.yml' # Uncomment to add recording rules

---

scrape_configs:

  # SFTP Exporter - Primary Job (Phase 4)
  - job_name: 'sftp-exporter'
    
    # Scrape settings
    scrape_interval: 30s          # How often to scrape
    scrape_timeout: 10s           # Timeout for each scrape
    metrics_path: '/metrics'      # Endpoint path
    
    # Static targets (local development/testing)
    static_configs:
      - targets: ['localhost:1210']
        labels:
          instance: 'local'
          service_type: 'sftp-exporter'
          phase: '4'
    
    # Authentication (if bearer token configured)
    # Uncomment and set token if SFTP exporter has bearer_token configured
    # honor_timestamps: false
    # bearer_token: 'your-secret-token-here'
    
    # Relabeling (optional, for advanced use)
    metric_relabel_configs:
      # Keep only Phase 4 metrics (optional)
      - source_labels: [__name__]
        regex: 'sftp_exporter_.*|sftp_.*'
        action: keep

  # SFTP Exporter - Health Check Endpoint (optional)
  - job_name: 'sftp-exporter-health'
    
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: '/health'
    
    static_configs:
      - targets: ['localhost:1210']
    
    # These are informational only, not full metrics
    metric_relabel_configs:
      - action: drop
        regex: '.*'
        source_labels: [__name__]

  # SFTP Exporter - Diagnostics (optional)
  - job_name: 'sftp-exporter-diagnostics'
    
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: '/diagnostics'
    
    static_configs:
      - targets: ['localhost:1210']

---

