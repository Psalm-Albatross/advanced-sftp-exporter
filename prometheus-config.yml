# Local Development Setup (macOS)

# 1. Install Prometheus via Homebrew
#    brew install prometheus
#
# 2. Create prometheus.yml (copy the content of this file to):
#    ~/prometheus/prometheus.yml
#
# 3. Start Prometheus
#    cd ~/prometheus && ./prometheus --config.file=prometheus.yml
#
# 4. Access UI
#    http://localhost:9090
#
# 5. Query SFTP Exporter metrics
#    See "PromQL Query Examples" section above

---

# Production Setup (Linux with systemd)

# 1. Edit /etc/prometheus/prometheus.yml
#    Add the scrape_configs section (see above)
#
# 2. Reload Prometheus configuration
#    sudo systemctl reload prometheus
#
# 3. Verify scraping (in Prometheus UI)
#    Status → Targets
#    Should show "sftp-exporter" with green UP status
#
# 4. Alert on issues (optional)
#    Add alert rules from "Alert Rules" section above
#    sudo systemctl reload prometheus

