# PromQL Query Examples (for testing in Prometheus UI)

# System Health Queries:
#
# 1. Exporter uptime
#    sftp_exporter_uptime_seconds
#
# 2. Current goroutines
#    sftp_exporter_goroutine_count
#
# 3. Memory usage
#    sftp_exporter_memory_usage_bytes / 1024 / 1024  (in MB)
#
# 4. Scrape latency p99
#    histogram_quantile(0.99, sftp_exporter_scrape_duration_seconds_bucket)
#
# 5. Error rate (per minute)
#    rate(sftp_exporter_error_count_total[1m])
#
# SFTP Connection Queries:
#
# 6. Active connections
#    sftp_connection_active_total
#
# 7. Average connection duration
#    rate(sftp_connection_duration_seconds_sum[5m]) / 
#    rate(sftp_connection_duration_seconds_count[5m])
#
# 8. Connection success rate
#    rate(sftp_connection_status_total{status="success"}[5m]) /
#    rate(sftp_connection_status_total[5m])
#
# Anomaly Detection Queries:
#
# 9. Anomalies detected (count)
#    increase(sftp_anomaly_detection_triggered_total[1h])
#
# 10. Top anomalies by user
#     topk(5, sftp_anomaly_detection_score)
#
# Performance Queries:
#
# 11. File operation latency p95
#     histogram_quantile(0.95, sftp_file_operation_latency_seconds_bucket)
#
# 12. Bandwidth utilization (bytes/sec)
#     rate(sftp_user_upload_bytes_total[1m]) + 
#     rate(sftp_user_download_bytes_total[1m])

