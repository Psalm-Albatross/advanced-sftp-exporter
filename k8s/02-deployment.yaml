---
# Deployment for Advanced SFTP Exporter
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp-exporter
  namespace: sftp-exporter
  labels:
    app: advanced-sftp-exporter
    version: v1.4.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: advanced-sftp-exporter
  template:
    metadata:
      labels:
        app: advanced-sftp-exporter
        version: v1.4.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "1210"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sftp-exporter
      
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Pod anti-affinity to spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - advanced-sftp-exporter
                topologyKey: kubernetes.io/hostname
      
      # Restart policy
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      
      containers:
      - name: sftp-exporter
        image: advanced-sftp-exporter:latest
        imagePullPolicy: Always
        
        # Container security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
        
        # Port configuration
        ports:
        - name: metrics
          containerPort: 1210
          protocol: TCP
        
        # Environment variables
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: METRICS_PATH
          value: "/metrics"
        - name: HEALTH_PATH
          value: "/health"
        - name: READINESS_PATH
          value: "/readiness"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        
        # Command and args
        command:
        - /usr/local/bin/advanced-sftp-exporter
        args:
        - -web.listen-address=:1210
        - -auth-log=/var/log/auth.log
        - -home-base=/home
        - -config=/etc/sftp-exporter/config.yaml
        
        # Liveness probe - restart if unhealthy
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe - remove from service if not ready
        readinessProbe:
          httpGet:
            path: /readiness
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Startup probe - allow time for startup
        startupProbe:
          httpGet:
            path: /health
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 30
        
        # Resource limits and requests
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        # Volume mounts
        volumeMounts:
        - name: config
          mountPath: /etc/sftp-exporter
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /var/log
        - name: auth-log
          mountPath: /var/log/auth.log
          subPath: auth.log
          readOnly: true
      
      # Volumes
      volumes:
      - name: config
        configMap:
          name: sftp-exporter-config
      - name: data
        persistentVolumeClaim:
          claimName: sftp-exporter-data
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: auth-log
        hostPath:
          path: /var/log/auth.log
          type: File

---
# Service for metrics exposure
apiVersion: v1
kind: Service
metadata:
  name: sftp-exporter
  namespace: sftp-exporter
  labels:
    app: advanced-sftp-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "1210"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: advanced-sftp-exporter
  ports:
  - name: metrics
    port: 1210
    targetPort: metrics
    protocol: TCP

---
# ServiceMonitor for Prometheus Operator integration
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sftp-exporter
  namespace: sftp-exporter
  labels:
    app: advanced-sftp-exporter
spec:
  selector:
    matchLabels:
      app: advanced-sftp-exporter
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scrapeTimeout: 10s
    relabeling:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
