---

# Notes:
# 1. All durations use Go syntax: "10s", "5m", "1h"
# 2. All sizes use bytes or MB where noted
# 3. Empty strings ("") = feature disabled or default
# 4. Phase 2 optimizations active by default (adaptive polling, cardinality limiting)
# 5. Phase 3 features active by default (anomaly, quota, latency, protocol detection)
# 6. Phase 4 architecture: monitors manageable via registry
# 7. Environment variables override config file values (SFTP_EXPORTER_* prefix)
#
# For environment variable override, use:
# SFTP_EXPORTER_LOG_LEVEL=DEBUG
# SFTP_EXPORTER_WEB_PORT=9116
# SFTP_EXPORTER_SECURITY_STRICT_MODE=true
# etc.
